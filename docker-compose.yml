version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Banco de Dados MySQL 8.0 (Aplicação PHP e n8n)
  # ----------------------------------------------------------------------------
  paozin-db:
    image: mysql:8.0
    container_name: paozin-db
    restart: always
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: paozin_db
      MYSQL_ROOT_PASSWORD: root_password_local
      MYSQL_USER: paozin_user
      MYSQL_PASSWORD: paozin_password_local
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - paozin-net

  # ----------------------------------------------------------------------------
  # 2. Orquestrador de Automação n8n (Fila de Webhooks e Disparos)
  # ----------------------------------------------------------------------------
  paozin-n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: paozin-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - paozin-db
    networks:
      - paozin-net

  # ----------------------------------------------------------------------------
  # 3. Gateway de WhatsApp (Evolution API - Instância Centralizada)
  # ----------------------------------------------------------------------------
  paozin-whatsapp-api:
    image: atendai/evolution-api:v1.8.2
    container_name: paozin-evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_TYPE=v1
      - SERVER_PORT=8080
      - COOKIE_SESSION_SECRET=paozin_secret_key_local_homelab
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=paozin_api_key_secreta
    volumes:
      - evolution_data:/evolution/instances
    networks:
      - paozin-net

volumes:
  mysql_data:
    name: paozin_mysql_data
  n8n_data:
    name: paozin_n8n_data
  evolution_data:
    name: paozin_evolution_data

networks:
  paozin-net:
    name: paozin_network
    driver: bridge
